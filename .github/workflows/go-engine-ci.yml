name: go-engine-ci

on:
  push:
    paths: [engine-go/**, desktop-go/**]
  pull_request:
    paths: [engine-go/**, desktop-go/**]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build engine (single exe)
        working-directory: engine-go
        run: go build -o autoscanner-go.exe .
      - name: Vet engine
        working-directory: engine-go
        run: go vet ./...
      - name: Test engine (includes Python↔Go parity; python preinstalled on runner)
        working-directory: engine-go
        run: go test -count=1 ./...
      - name: Build desktop shell
        working-directory: desktop-go
        run: go build -o recon-desktop.exe .
      - name: Test desktop shell
        working-directory: desktop-go
        run: go test -count=1 ./...
